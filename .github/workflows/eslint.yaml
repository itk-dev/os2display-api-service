### ### ESLint
###
### Lints the frontend assets with ESLint.
###
### #### Assumptions
###
### 1. A docker compose service named `node` can be run and `npm` can be run
###    inside the `node` service.
### 2. `npm run lint:js` is defined in `package.json`.

on: pull_request

name: ESLint

env:
  COMPOSE_USER: runner

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - name: Setup network
        run: docker network create frontend

      - name: Install dependencies
        run: docker compose run --rm node npm install

      - name: Lint
        run: docker compose run --rm node npm run lint:js
